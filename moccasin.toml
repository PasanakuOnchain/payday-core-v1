[project]
src = "src"
out = "out"
dot_env = ".env"
dependencies = ["snekmate"]

[networks.pyevm]
is_zksync = false

[networks.monad]
url = "https://rpc.monad.xyz"
chain_id = 143
is_zksync = false
prompt_live = true
save_to_db = true
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "$ETHERSCAN_API_KEY"

[networks.monad-testnet]
url = "https://testnet-rpc.monad.xyz"
chain_id = 10143
is_zksync = false
prompt_live = true
save_to_db = true
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "$ETHERSCAN_API_KEY"
